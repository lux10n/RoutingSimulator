# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/guides/orchestrate/jobs-steps/#jobs-overview & https://circleci.com/docs/reference/configuration-reference/#jobs
jobs:
  semgrep-scan:
    description: |
      Scan the repo with Semgrep to detect security issues and bad practices.

    docker:
      - image: semgrep/semgrep

    parameters:
      fail-blocking:
        type: boolean
        description: "Fail the pipeline if blocking issues are found. Values : true, false"
        default: true

    steps:
      - checkout
      - run:
          name: Setup scan environment
          command: |
            git clone https://github.com/lux10n/semgrep2html.git
            pip install -r semgrep2html/requirements.txt
            mkdir /tmp/reports
            SEMGREP_REPORT_FILENAME="${CIRCLE_PROJECT_REPONAME}-${CIRCLE_BRANCH}-$(date +'%Y%m%d-%H%M%S')"
            echo "export SEMGREP_REPORT_FILENAME=$SEMGREP_REPORT_FILENAME" >> "$BASH_ENV"

      - run:
          name: Run scan
          command: semgrep scan --config auto --json-output _semgrep-findings.json

      - run:
          name: Generate report
          command: |
            python semgrep2html/parse-semgrep.py \
              --input _semgrep-findings.json \
              --output /tmp/reports/$SEMGREP_REPORT_FILENAME.html \
              --project-name $CIRCLE_PROJECT_REPONAME \
              --branch $CIRCLE_BRANCH

      - store_artifacts:
          path: /tmp/reports
          destination: reports

      - run:
          name: Fail if blocking issues exist
          environment:
            FAIL_BLOCKING: <<parameters.fail-blocking>>
          command: |
            #!/bin/bash
            BLOCKING_ISSUES=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' _semgrep-findings.json)
            if [ "$BLOCKING_ISSUES" -gt 0 ]; then
                if [ "$FAIL_BLOCKING" -eq 1 ]; then
                    echo "[FAIL] $BLOCKING_ISSUES blocking issues detected! Please check the scanning steps for more details."
                    exit 1
                else
                    echo "[WARNING] $BLOCKING_ISSUES blocking issues detected, but pipeline will not fail due to configuration."
                fi
            else
                echo "[SUCCESS] No blocking issues found."
            fi


# Orchestrate jobs using workflows
# See: https://circleci.com/docs/guides/orchestrate/workflows/ & https://circleci.com/docs/reference/configuration-reference/#workflows
workflows:
  sample: # This is the name of the workflow, feel free to change it to better match your workflow.
    # Inside the workflow, you define the jobs you want to run.
    jobs:
      - semgrep-scan